name = "clothing-design"
main = "dist/worker.mjs"
compatibility_date = "2026-06-02"
compatibility_flags = ["nodejs_compat"]

[vars]
DB_TYPE = "d1"
APP_BASE_URL = "https://www.cloz-design.com"
DODO_PAYMENTS_ENVIRONMENT = "live_mode"
DODO_PRO_MONTHLY_PRODUCT_ID = "pdt_0NnnhMjKZE0S5y7c74oI6"
DODO_PRO_YEARLY_PRODUCT_ID = "pdt_0NnnhXqc1hwnNQubQkHRX"
DODO_MAX_MONTHLY_PRODUCT_ID = "pdt_0NnnhuSBJVyZWRVe4A3x4"
DODO_MAX_YEARLY_PRODUCT_ID = "pdt_0Nnni73BBrP63K1eCXnH9"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "clothing-design"
database_id = "fcbfbc5c-58d5-46dd-a8c6-43c91c3d730c"

[[r2_buckets]]
binding = "OBJECT_FILE"
bucket_name = "clothing-design"

[assets]
directory = "public"
