<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>万圣节卫衣</title><script type="module" src="../../public/vendor/model-viewer/model-viewer.min.js"></script><style>body{margin:0;padding:24px;background:#eeede9;font:14px system-ui}h1{font-size:20px;font-weight:500}.layout{display:grid;grid-template-columns:1fr 1.5fr;gap:24px}img{width:100%;background:white}model-viewer{width:100%;height:76vh;background:#faf9f5;border-radius:7px}button{padding:8px 14px;margin:8px 6px 0 0;cursor:pointer}#status{margin:12px 0}</style><h1>万圣节卫衣</h1><div class="layout"><div><h2 style="font-size:14px;font-weight:500">设计正背面</h2><img src="designed-front-back.png" alt="AI 生成的万圣节卫衣设计正背面"><h2 style="font-size:14px;font-weight:500">映射依据 · SVG 分片颜色</h2><img src="color-guide.svg" style="max-height:420px;object-fit:contain" alt="直接填色的原始 UV SVG"></div><div><model-viewer id="viewer" src="../ai-christmas-hoodie-v1/garment-decoded.glb" loading="eager" reveal="auto" camera-controls camera-orbit="0deg 90deg 110%" field-of-view="28deg" shadow-intensity=".2" exposure=".65" alt="万圣节卫衣 3D 预览"></model-viewer><div><button data-view="0deg">正面</button><button data-view="180deg">背面</button><button data-view="90deg">左侧</button><button data-view="-90deg">右侧</button><button id="white">白模预览</button><button id="generated">应用 AI 贴图</button><button id="guide">恢复颜色标记</button></div><p id="status" role="status">加载中…</p></div></div><script type="module">
const viewer=document.getElementById('viewer'),status=document.getElementById('status');
async function apply(source){const image=new Image();image.src=source;await image.decode();const canvas=document.createElement('canvas');canvas.width=2048;canvas.height=2048;canvas.getContext('2d').drawImage(image,0,0,2048,2048);const texture=await viewer.createTexture(canvas.toDataURL('image/png'));for(const m of viewer.model.materials){await m.ensureLoaded();const p=m.pbrMetallicRoughness;p.setBaseColorFactor([1,1,1,1]);p.setMetallicFactor(0);p.setRoughnessFactor(.86);p.baseColorTexture.setTexture(texture);const sampler=p.baseColorTexture.texture.sampler;sampler.setScale({u:.5487988591194153,v:-.5487988591194153});sampler.setOffset({u:.22206835448741913,v:.9807692766189575});}await viewer.updateComplete;status.textContent=source==='white-guide.svg'?'白模已应用':source.endsWith('.svg')?'颜色标记已应用':'AI 贴图已应用';}
viewer.addEventListener('load',()=>apply('generated-atlas-placed.png').catch(e=>status.textContent=e.message),{once:true});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{viewer.cameraOrbit=b.dataset.view+' 90deg 110%';viewer.jumpCameraToGoal();});document.getElementById('white').onclick=()=>apply('white-guide.svg').catch(e=>status.textContent=e.message);document.getElementById('generated').onclick=()=>apply('generated-atlas-placed.png').catch(e=>status.textContent=e.message);document.getElementById('guide').onclick=()=>apply('color-guide.svg').catch(e=>status.textContent=e.message);
</script></html>
