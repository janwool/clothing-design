<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T-shirt · 网页模型检验</title>
<script type="module" src="/vendor/model-viewer/model-viewer.min.js"></script><script src="/js/camera-relative-studio-light.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#242721;font:15px "Helvetica Neue",sans-serif}header{padding:24px 32px;border-bottom:1px solid #d8dbd2;display:flex;justify-content:space-between;align-items:center}small{font-size:11px;letter-spacing:2px;color:#737b6c}h1{font-size:24px;font-weight:500;margin:5px 0}main{display:grid;grid-template-columns:1fr 300px;height:calc(100vh - 105px)}model-viewer{width:100%;height:100%;background:#f4f4f1}aside{padding:28px;border-left:1px solid #d8dbd2;background:#fff}p{line-height:1.8;color:#656b60}button{font:inherit;padding:10px 14px;background:white;border:1px solid #c7cec0;border-radius:4px;cursor:pointer}button:hover{background:#edf1e8}nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 28px}label{display:block;margin:20px 0}input{width:100%;margin-top:12px}#status{font-size:13px}#error{color:#b33228}@media(max-width:750px){main{display:flex;flex-direction:column;height:auto}model-viewer{height:65vh}aside{border-left:0}header{padding:16px}}</style>
<header><div><small>CLOZ / MATERIAL REVIEW</small><h1>T-shirt 网页实时预览</h1></div><small>WEB GLB · V16</small></header><main><model-viewer id="viewer" src="./tshirt-web-v16.glb?v=2" min-camera-orbit="auto auto 15%" camera-controls interaction-prompt="none" camera-orbit="-16deg 72deg 142%" field-of-view="28deg" tone-mapping="commerce" exposure="0.82" shadow-intensity="0.32" shadow-softness="0.9" environment-image="/environments/commercial-apparel-studio-v5-front-white-20260917.hdr" alt="可旋转的 T-shirt 三维模型"></model-viewer><aside><small>01 / INSPECT</small><p>拖动旋转，滚轮缩放。直接检查领口、袖口、侧缝和背面。</p><nav><button data-angle="0deg">正面</button><button data-angle="90deg">侧面</button><button data-angle="180deg">背面</button><button id="collar">领口</button><button id="hem">下摆</button><button id="arm">右腋下</button><button id="armLeft">左腋下</button><button id="sleeveRight">右袖</button><button id="sleeveLeft">左袖</button><button id="sleeveBack">袖后侧</button><button id="whole">全貌</button></nav><small>02 / SURFACE</small><nav><button data-color=".66,.635,.585">米白</button><button data-color=".12,.16,.11">苔绿</button><button data-color=".035,.04,.045">炭黑</button></nav><label>曝光 <input id="exposure" type="range" min="0.5" max="1.5" step="0.02" value="0.82"></label><button id="materialMode">对比：网站统一材质</button><p id="status">模型加载中…</p><p id="error" role="alert"></p><p>使用网站同款查看器与环境光。当前保留模型自带的棉布、罗纹与缝线材质参数。</p></aside></main>
<script>
const v=document.querySelector('#viewer');let originals=[],materials=[],siteMode=false;
v.addEventListener('load',()=>{materials=v.model.materials.filter(m=>m.isActive);originals=materials.map(m=>({rough:m.pbrMetallicRoughness.roughnessFactor,color:[...m.pbrMetallicRoughness.baseColorFactor]}));document.querySelector('#status').textContent='已加载 · 拖动检查模型';window.CameraRelativeStudioLight?.install(v,{environmentImage:v.environmentImage,referenceAzimuthDeg:-16,azimuthOffsetDeg:45});window.previewReady=true;});
v.addEventListener('error',e=>document.querySelector('#error').textContent='模型加载失败：'+e.detail.type);
document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{v.cameraTarget='auto auto auto';v.cameraOrbit=b.dataset.angle+' 75deg 142%'});
document.querySelector('#collar').onclick=()=>{v.cameraTarget='0m 0.29m 0m';v.cameraOrbit='-10deg 65deg 48%'};
document.querySelector('#hem').onclick=()=>{v.cameraTarget='0m -0.31m 0m';v.cameraOrbit='-16deg 80deg 65%'};
document.querySelector('#arm').onclick=()=>{v.cameraTarget='0.15m -0.04m 0m';v.cameraOrbit='55deg 88deg 55%'};
document.querySelector('#armLeft').onclick=()=>{v.cameraTarget='-0.15m -0.04m 0m';v.cameraOrbit='-55deg 88deg 55%'};
document.querySelector('#sleeveRight').onclick=()=>{v.cameraTarget='0.19m 0.065m 0m';v.cameraOrbit='15deg 82deg 32%';window.scrollTo({top:0})};
document.querySelector('#sleeveLeft').onclick=()=>{v.cameraTarget='-0.19m 0.065m 0m';v.cameraOrbit='-15deg 82deg 32%';window.scrollTo({top:0})};
document.querySelector('#sleeveBack').onclick=()=>{v.cameraTarget='0.19m 0.065m 0m';v.cameraOrbit='130deg 82deg 38%';window.scrollTo({top:0})};
document.querySelector('#whole').onclick=()=>{v.cameraTarget='auto auto auto';v.cameraOrbit='-16deg 72deg 142%'};
document.querySelector('#exposure').oninput=e=>v.exposure=+e.target.value;
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>materials.forEach((m,i)=>{const c=b.dataset.color.split(',').map(Number),f=i===1?.9:1;m.pbrMetallicRoughness.setBaseColorFactor([...c.map(x=>x*f),1])}));
document.querySelector('#materialMode').onclick=e=>{siteMode=!siteMode;materials.forEach((m,i)=>m.pbrMetallicRoughness.setRoughnessFactor(siteMode?.62:originals[i].rough));e.target.textContent=siteMode?'恢复模型原生材质':'对比：网站统一材质'};

</script></html>
